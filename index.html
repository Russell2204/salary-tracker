<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Зарплата</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0e0f13; --surface: #16181f; --surface2: #1d2029;
    --border: #2a2d38; --border2: #363a4a;
    --text: #eef0f6; --muted: #7a7f96;
    --accent: #6c8fff; --green: #3ecf8e;
    --amber: #f5a623; --red: #ff5c5c;
    --purple: #b57bee; --teal: #38c9c9;
    --radius: 14px; --radius-sm: 9px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Onest', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.5; }
  .app { max-width: 860px; margin: 0 auto; padding: 2rem 1.25rem 5rem; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5rem; }
  .logo { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .rate-block {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.25rem 1.5rem; margin-bottom: 2rem;
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  }
  .rate-label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
  .rate-value { font-size: 1.6rem; font-weight: 700; color: var(--green); }
  .rate-edit { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .rate-input {
    background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm);
    color: var(--text); font-family: inherit; font-size: 15px; padding: 7px 12px; width: 160px; outline: none; transition: border-color .2s;
  }
  .rate-input:focus { border-color: var(--accent); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: none; border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 500;
    cursor: pointer; padding: 8px 16px; transition: opacity .2s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: .88; }
  .btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: rgba(255,92,92,.12); color: var(--red); border: 1px solid rgba(255,92,92,.25); }
  .btn-danger:hover { background: rgba(255,92,92,.22); }
  .btn-sm { padding: 5px 11px; font-size: 13px; border-radius: 7px; }
  .btn-icon { padding: 7px; border-radius: 8px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; margin-top: 2rem; }
  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .day-tabs {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px;
  }
  .day-tab {
    padding: 7px 18px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
    border: 1px solid transparent; color: var(--muted); background: transparent; font-family: inherit; transition: all .2s;
  }
  .day-tab:hover { color: var(--text); border-color: var(--border2); }
  .day-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .stream-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1rem; overflow: hidden; }
  .stream-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: .85rem 1.25rem; background: var(--surface2); border-bottom: 1px solid var(--border);
  }
  .stream-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
  .stream-total { font-size: 16px; font-weight: 700; color: var(--amber); }
  .group-card {
    display: flex; align-items: center; padding: .85rem 1.25rem;
    border-bottom: 1px solid var(--border); gap: .75rem; flex-wrap: wrap;
  }
  .group-card:last-child { border-bottom: none; }
  .group-name-display { font-weight: 500; flex: 1; min-width: 100px; }
  .group-count-row { display: flex; align-items: center; gap: 8px; }
  .count-btn {
    width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border2);
    background: transparent; color: var(--text); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; font-family: inherit; transition: all .15s;
  }
  .count-btn:hover { background: var(--border2); }
  .count-display {
    min-width: 42px; text-align: center; font-weight: 600; font-size: 15px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
    padding: 3px 8px; cursor: pointer;
  }
  .count-input-inline {
    width: 60px; background: var(--surface2); border: 1px solid var(--accent);
    border-radius: 7px; color: var(--text); font-family: inherit; font-size: 15px;
    font-weight: 600; text-align: center; padding: 3px 8px; outline: none;
  }
  .group-sum { font-weight: 600; color: var(--green); min-width: 120px; text-align: right; font-size: 14px; }
  .group-name-edit {
    background: var(--surface2); border: 1px solid var(--accent); border-radius: 8px;
    color: var(--text); font-family: inherit; font-size: 15px; font-weight: 500;
    padding: 4px 10px; outline: none; width: 160px;
  }
  .add-group-form {
    display: flex; gap: 8px; padding: .85rem 1.25rem;
    border-top: 1px dashed var(--border2); flex-wrap: wrap; align-items: center;
  }
  .form-input {
    background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm);
    color: var(--text); font-family: inherit; font-size: 14px; padding: 7px 12px; outline: none; transition: border-color .2s;
  }
  .form-input:focus { border-color: var(--accent); }
  .name-input { flex: 1; min-width: 120px; }
  .count-input-sm { width: 90px; }
  .total-block {
    background: linear-gradient(135deg, #1a2040 0%, #1d1f2e 100%);
    border: 1px solid rgba(108,143,255,.3); border-radius: var(--radius);
    padding: 1.5rem; margin-top: 2rem;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
  }
  .total-label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .total-value { font-size: 2rem; font-weight: 700; color: var(--accent); }
  .income-item {
    display: flex; align-items: center; padding: .75rem 1.25rem;
    border-bottom: 1px solid var(--border); gap: .75rem;
  }
  .income-item:last-child { border-bottom: none; }
  .income-item-name { flex: 1; font-weight: 500; }
  .income-item-amount { font-weight: 600; color: var(--purple); min-width: 110px; text-align: right; }
  .income-add-form {
    display: flex; gap: 8px; padding: .85rem 1.25rem;
    border-top: 1px dashed var(--border2); flex-wrap: wrap; align-items: center;
  }
  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 60vh; color: var(--muted); font-size: 15px; flex-direction: column; gap: 1rem;
  }
  .spinner {
    width: 32px; height: 32px; border: 2px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .setup-screen {
    max-width: 520px; margin: 5vh auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem;
  }
  .setup-screen h2 { font-size: 1.3rem; margin-bottom: .5rem; }
  .setup-screen p { color: var(--muted); font-size: 14px; margin-bottom: 1.5rem; }
  .setup-hint { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.8; }
  .empty-state { color: var(--muted); font-size: 13px; padding: .85rem 1.25rem; font-style: italic; }
  .stream-blocks-list { display: flex; flex-direction: column; gap: .6rem; }
</style>
</head>
<body>
<div id="root"><div class="loading"><div class="spinner"></div><span>Загрузка...</span></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

// ══════════════════════════════════════════════════════════════
// ЗАМЕНИ ЭТИ ДАННЫЕ СВОИМИ ИЗ FIREBASE CONSOLE
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDFvX5KHUNz90ug8ESgNFjDIFvI2KWC5RU",
  authDomain: "project-3938641027549520422.firebaseapp.com",
  projectId: "project-3938641027549520422",
  storageBucket: "project-3938641027549520422.firebasestorage.app",
  messagingSenderId: "661894847480",
  appId: "1:661894847480:web:18c9ad5f50381ff374540d",
  measurementId: "G-XW1TJRTXFK"
};
// ══════════════════════════════════════════════════════════════

const DAY_LABELS = { "mn-fri": "Пн–Пт", "tu-th": "Вт–Чт", "we-sa": "Ср–Сб", "su": "Вс" };
const DAY_KEYS = Object.keys(DAY_LABELS);

let db;
let state = { rate: 170000, groups: [], otherIncome: [] };
let editingRateMode = false;
let activeDayTab = "mn-fri";
let editingCountId = null;
let editingNameId = null;

function fmt(n) { return new Intl.NumberFormat("ru-RU").format(Math.round(n)) + " сум"; }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function isConfigured() { return FIREBASE_CONFIG.apiKey !== "REPLACE_WITH_YOUR_API_KEY"; }

function initFirebase() {
  const app = initializeApp(FIREBASE_CONFIG);
  db = getFirestore(app);
  onSnapshot(doc(db, "settings", "main"), snap => {
    if (snap.exists()) state.rate = snap.data().rate ?? 170000;
    render();
  });
  onSnapshot(collection(db, "groups"), snap => {
    state.groups = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  onSnapshot(collection(db, "otherIncome"), snap => {
    state.otherIncome = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

const saveRate = v => setDoc(doc(db, "settings", "main"), { rate: v });
const addGroup = (name, count, day) => addDoc(collection(db, "groups"), { name, count: parseInt(count)||0, day });
const updateGroup = (id, data) => updateDoc(doc(db, "groups", id), data);
const deleteGroup = id => deleteDoc(doc(db, "groups", id));
const addOtherIncome = (name, amount) => addDoc(collection(db, "otherIncome"), { name, amount: parseInt(amount)||0 });
const updateOtherIncome = (id, data) => updateDoc(doc(db, "otherIncome", id), data);
const deleteOtherIncome = id => deleteDoc(doc(db, "otherIncome", id));

function render() {
  if (!isConfigured()) { renderSetup(); return; }
  document.getElementById("root").innerHTML = buildHTML();
  attachListeners();
}

function buildHTML() {
  const tab = activeDayTab;
  const tabGroups = state.groups.filter(g => g.day === tab);
  const totalGroups = state.groups.reduce((s,g) => s + g.count * state.rate, 0);
  const totalOther = state.otherIncome.reduce((s,i) => s + (i.amount||0), 0);
  const grand = totalGroups + totalOther;

  return `<div class="app">
  <div class="header"><div class="logo">Зар<span>плата</span></div></div>

  <div class="rate-block">
    <div>
      <div class="rate-label">Ставка за студента</div>
      <div class="rate-value">${fmt(state.rate)}</div>
    </div>
    <div class="rate-edit">
      ${editingRateMode ? `
        <input class="rate-input" id="rate-input" type="number" value="${state.rate}" />
        <button class="btn btn-primary btn-sm" id="rate-save">Сохранить</button>
        <button class="btn btn-ghost btn-sm" id="rate-cancel">Отмена</button>
      ` : `<button class="btn btn-ghost btn-sm" id="rate-edit-btn">✏️ Изменить</button>`}
    </div>
  </div>

  <div class="section-header"><div class="section-title">Группы по потокам</div></div>
  <div class="day-tabs">
    ${DAY_KEYS.map(k=>`<button class="day-tab${tab===k?" active":""}" data-day="${k}">${DAY_LABELS[k]}</button>`).join("")}
  </div>

  <div class="stream-block">
    <div class="stream-header">
      <span class="stream-name">${DAY_LABELS[tab]}</span>
      <span class="stream-total">${fmt(tabGroups.reduce((s,g)=>s+g.count*state.rate,0))}</span>
    </div>
    ${tabGroups.length===0?`<div class="empty-state">Нет групп — добавь первую ниже</div>`:""}
    ${tabGroups.map(g=>buildGroupCard(g)).join("")}
    <div class="add-group-form">
      <input class="form-input name-input" id="new-group-name" placeholder="Название группы" />
      <input class="form-input count-input-sm" id="new-group-count" type="number" min="0" placeholder="Студентов" />
      <button class="btn btn-primary btn-sm" id="add-group-btn">+ Добавить группу</button>
    </div>
  </div>

  <div class="section-header" style="margin-top:2rem"><div class="section-title">Итого по потокам</div></div>
  <div class="stream-blocks-list">
    ${DAY_KEYS.map(k=>{
      const gs=state.groups.filter(g=>g.day===k);
      if(!gs.length) return "";
      return `<div style="display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.75rem 1.25rem;">
        <span style="font-size:13px;color:var(--muted);font-weight:600;">${DAY_LABELS[k]}<span style="color:var(--border2);margin:0 8px">·</span><span style="color:var(--muted)">${gs.length} гр.</span></span>
        <span style="font-weight:700;color:var(--teal)">${fmt(gs.reduce((s,g)=>s+g.count*state.rate,0))}</span>
      </div>`;
    }).join("")}
  </div>

  <div class="section-header"><div class="section-title">Другие источники дохода</div></div>
  <div class="stream-block">
    ${state.otherIncome.length===0?`<div class="empty-state">Нет записей — добавь ниже</div>`:""}
    ${state.otherIncome.map(item=>`
      <div class="income-item">
        <div class="income-item-name">${esc(item.name)}</div>
        <div class="income-item-amount">${fmt(item.amount)}</div>
        <button class="btn btn-ghost btn-icon btn-sm" data-edit-income="${item.id}">✏️</button>
        <button class="btn btn-danger btn-icon btn-sm" data-del-income="${item.id}">🗑</button>
      </div>`).join("")}
    <div class="income-add-form">
      <input class="form-input name-input" id="new-income-name" placeholder="Название" />
      <input class="form-input count-input-sm" id="new-income-amount" type="number" min="0" placeholder="Сумма" />
      <button class="btn btn-primary btn-sm" id="add-income-btn">+ Добавить</button>
    </div>
  </div>

  <div class="total-block">
    <div><div class="total-label">С групп</div><div style="font-size:1.15rem;font-weight:700;color:var(--green)">${fmt(totalGroups)}</div></div>
    ${totalOther>0?`<div><div class="total-label">Другие доходы</div><div style="font-size:1.15rem;font-weight:700;color:var(--purple)">${fmt(totalOther)}</div></div>`:""}
    <div><div class="total-label">Общая зарплата</div><div class="total-value">${fmt(grand)}</div></div>
  </div>
</div>`;
}

function buildGroupCard(g) {
  const isCount = editingCountId === g.id;
  const isName = editingNameId === g.id;
  return `<div class="group-card">
    ${isName
      ? `<input class="group-name-edit" data-nameid="${g.id}" value="${esc(g.name)}" />`
      : `<div class="group-name-display" style="cursor:pointer" data-editname="${g.id}">${esc(g.name)}</div>`}
    <div class="group-count-row">
      <button class="count-btn" data-dec="${g.id}">−</button>
      ${isCount
        ? `<input class="count-input-inline" type="number" data-countid="${g.id}" value="${g.count}" min="0" />`
        : `<div class="count-display" data-editcount="${g.id}">${g.count}</div>`}
      <button class="count-btn" data-inc="${g.id}">+</button>
      <span style="color:var(--muted);font-size:12px">студ.</span>
    </div>
    <div class="group-sum">${fmt(g.count * state.rate)}</div>
    <button class="btn btn-danger btn-icon btn-sm" data-del="${g.id}">🗑</button>
  </div>`;
}

function attachListeners() {
  const $ = id => document.getElementById(id);
  const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,fn));

  $("rate-edit-btn")?.addEventListener("click", ()=>{ editingRateMode=true; render(); setTimeout(()=>$("rate-input")?.focus(),0); });
  $("rate-cancel")?.addEventListener("click", ()=>{ editingRateMode=false; render(); });
  const doSaveRate = async () => { const v=parseInt($("rate-input").value); if(v>0){ await saveRate(v); editingRateMode=false; } };
  $("rate-save")?.addEventListener("click", doSaveRate);
  $("rate-input")?.addEventListener("keydown", e=>{ if(e.key==="Enter") doSaveRate(); if(e.key==="Escape"){ editingRateMode=false; render(); } });

  on(".day-tab","click", e=>{ activeDayTab=e.currentTarget.dataset.day; editingCountId=null; editingNameId=null; render(); });

  $("add-group-btn")?.addEventListener("click", async ()=>{
    const name=$("new-group-name").value.trim(); const count=$("new-group-count").value;
    if(!name) return;
    await addGroup(name, count||0, activeDayTab);
    $("new-group-name").value=""; $("new-group-count").value="";
  });
  $("new-group-name")?.addEventListener("keydown", e=>{ if(e.key==="Enter") $("add-group-btn").click(); });

  on("[data-inc]","click", async e=>{ const g=state.groups.find(x=>x.id===e.currentTarget.dataset.inc); if(g) await updateGroup(g.id,{count:g.count+1}); });
  on("[data-dec]","click", async e=>{ const g=state.groups.find(x=>x.id===e.currentTarget.dataset.dec); if(g&&g.count>0) await updateGroup(g.id,{count:g.count-1}); });

  on("[data-editcount]","click", e=>{ editingCountId=e.currentTarget.dataset.editcount; editingNameId=null; render(); setTimeout(()=>document.querySelector(`[data-countid="${editingCountId}"]`)?.select(),0); });
  on("[data-countid]","blur", async e=>{ const v=parseInt(e.target.value); if(!isNaN(v)&&v>=0){ await updateGroup(e.target.dataset.countid,{count:v}); editingCountId=null; } });
  on("[data-countid]","keydown", async e=>{ if(e.key==="Enter"){ const v=parseInt(e.target.value); if(!isNaN(v)&&v>=0){ await updateGroup(e.target.dataset.countid,{count:v}); editingCountId=null; } } if(e.key==="Escape"){ editingCountId=null; render(); } });

  on("[data-editname]","click", e=>{ editingNameId=e.currentTarget.dataset.editname; editingCountId=null; render(); setTimeout(()=>{ const i=document.querySelector(`[data-nameid="${editingNameId}"]`); i?.focus(); i?.select(); },0); });
  on("[data-nameid]","blur", async e=>{ const v=e.target.value.trim(); if(v){ await updateGroup(e.target.dataset.nameid,{name:v}); editingNameId=null; } });
  on("[data-nameid]","keydown", async e=>{ if(e.key==="Enter"){ const v=e.target.value.trim(); if(v){ await updateGroup(e.target.dataset.nameid,{name:v}); editingNameId=null; } } if(e.key==="Escape"){ editingNameId=null; render(); } });

  on("[data-del]","click", async e=>{ if(confirm("Удалить группу?")) await deleteGroup(e.currentTarget.dataset.del); });

  $("add-income-btn")?.addEventListener("click", async ()=>{
    const name=$("new-income-name").value.trim(); const amount=$("new-income-amount").value;
    if(!name||!amount) return;
    await addOtherIncome(name, parseInt(amount)||0);
    $("new-income-name").value=""; $("new-income-amount").value="";
  });
  on("[data-edit-income]","click", async e=>{
    const item=state.otherIncome.find(x=>x.id===e.currentTarget.dataset.editIncome);
    if(!item) return;
    const n=prompt("Название:",item.name); if(n===null) return;
    const a=prompt("Сумма:",item.amount); if(a===null) return;
    await updateOtherIncome(item.id,{name:n.trim()||item.name,amount:parseInt(a)||0});
  });
  on("[data-del-income]","click", async e=>{ if(confirm("Удалить?")) await deleteOtherIncome(e.currentTarget.dataset.delIncome); });
}

function renderSetup() {
  document.getElementById("root").innerHTML = `<div class="app"><div class="setup-screen">
    <h2>⚙️ Настройка Firebase</h2>
    <p>Открой этот HTML-файл в редакторе и замени значения в блоке <code style="background:var(--surface2);padding:2px 6px;border-radius:4px">FIREBASE_CONFIG</code> своими данными.</p>
    <div class="setup-hint">
      <b>Как получить данные:</b><br/>
      1. Открой <a href="https://console.firebase.google.com" style="color:var(--accent)" target="_blank">console.firebase.google.com</a><br/>
      2. Создай проект → Add app → Web (<code>&lt;/&gt;</code>)<br/>
      3. Скопируй объект <code>firebaseConfig</code><br/>
      4. Вставь значения в переменную <code>FIREBASE_CONFIG</code> в начале скрипта<br/>
      5. В Firebase Console: Build → Firestore Database → Create → <b>Test mode</b>
    </div>
    <div style="margin-top:1.25rem;padding:1rem;background:var(--surface2);border-radius:var(--radius-sm);font-size:12px;color:var(--muted);font-family:monospace;line-height:1.9;">
      apiKey: "..."<br/>authDomain: "...firebaseapp.com"<br/>projectId: "..."<br/>storageBucket: "..."<br/>messagingSenderId: "..."<br/>appId: "..."
    </div>
  </div></div>`;
}

if (isConfigured()) initFirebase(); else renderSetup();
</script>
</body>
</html>
