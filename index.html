<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Трекер доходов и расходов</title>
  <link rel="stylesheet" href="style.css">
  <script>
    if (localStorage.getItem("salary-tracker-theme") === "dark") {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
</head>
<body>
  <div class="page">
    <header class="header">
      <div>
        <p class="eyebrow">Личные финансы</p>
        <h1>Трекер доходов и расходов</h1>
      </div>
      <div class="header-tools">
        <label class="period">
          <span>Период</span>
          <select id="period"></select>
        </label>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">Тёмная</button>
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="Разделы">
      <button type="button" class="tab" role="tab" id="tab-stats" data-tab="stats" aria-controls="panel-stats" aria-selected="true">Итоги</button>
      <button type="button" class="tab" role="tab" id="tab-charts" data-tab="charts" aria-controls="panel-charts" aria-selected="false">Графики</button>
      <button type="button" class="tab" role="tab" id="tab-form" data-tab="form" aria-controls="panel-form" aria-selected="false">Операция</button>
      <button type="button" class="tab" role="tab" id="tab-list" data-tab="list" aria-controls="panel-list" aria-selected="false">Список</button>
    </div>

    <div class="tab-stage">
      <section class="tab-panel is-active" id="panel-stats" data-panel="stats" role="tabpanel" aria-labelledby="tab-stats" aria-hidden="false">
        <div class="stats" aria-label="Итоги периода">
          <article class="stat stat-income">
            <p class="stat-label">Доходы</p>
            <p class="stat-value" id="total-income">0 ₽</p>
          </article>
          <article class="stat stat-expense">
            <p class="stat-label">Расходы</p>
            <p class="stat-value" id="total-expense">0 ₽</p>
          </article>
          <article class="stat stat-balance">
            <p class="stat-label">Баланс</p>
            <p class="stat-value" id="balance">0 ₽</p>
          </article>
        </div>
      </section>

      <section class="tab-panel" id="panel-charts" data-panel="charts" role="tabpanel" aria-labelledby="tab-charts" aria-hidden="true">
        <div class="charts">
          <article class="panel">
            <h2 id="bar-title">Доходы и расходы по дням</h2>
            <div class="chart-wrap">
              <canvas id="bar-chart" aria-label="Столбчатая диаграмма доходов и расходов"></canvas>
            </div>
          </article>
          <article class="panel">
            <h2>Расходы по категориям</h2>
            <div class="chart-wrap chart-wrap-doughnut">
              <canvas id="doughnut-chart" aria-label="Расходы по категориям"></canvas>
              <p class="empty-chart" id="doughnut-empty" hidden>Нет данных</p>
            </div>
          </article>
        </div>
      </section>

      <section class="tab-panel" id="panel-form" data-panel="form" role="tabpanel" aria-labelledby="tab-form" aria-hidden="true">
        <article class="panel">
          <h2 id="form-title">Новая операция</h2>
          <form id="transaction-form" novalidate>
            <div class="fields">
              <label>
                Тип
                <select id="type" name="type" required>
                  <option value="income">Доход</option>
                  <option value="expense">Расход</option>
                </select>
              </label>
              <label>
                Сумма, ₽
                <input id="amount" name="amount" type="number" min="0.01" step="0.01" required>
              </label>
              <label>
                Категория
                <select id="category" name="category" required></select>
              </label>
              <label>
                Дата
                <input id="date" name="date" type="date" required>
              </label>
              <label class="field-wide">
                Комментарий
                <input id="note" name="note" type="text" maxlength="120" placeholder="Необязательно">
              </label>
            </div>
            <p class="form-error" id="form-error" hidden></p>
            <div class="form-actions">
              <button type="submit" id="submit-btn">Добавить</button>
              <button type="button" id="cancel-btn" class="ghost" hidden>Отмена</button>
            </div>
          </form>
        </article>
      </section>

      <section class="tab-panel" id="panel-list" data-panel="list" role="tabpanel" aria-labelledby="tab-list" aria-hidden="true">
        <article class="panel">
          <h2>Операции</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Дата</th>
                  <th>Тип</th>
                  <th>Категория</th>
                  <th>Комментарий</th>
                  <th class="num">Сумма</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="transactions"></tbody>
            </table>
            <p class="empty-list" id="empty-list" hidden>За выбранный период операций нет</p>
          </div>
        </article>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
